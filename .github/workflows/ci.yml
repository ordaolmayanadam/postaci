# Every push to main and every pull request: tests on Linux and Windows, then the WinUI app is
# built and published for x64 and ARM64. The published folders are kept as downloadable artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Testler (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Kütüphaneleri derle
        run: |
          dotnet build src/ExchangeMail.Core/ExchangeMail.Core.csproj -c Release
          dotnet build src/ExchangeMail.ViewModels/ExchangeMail.ViewModels.csproj -c Release

      - name: Testleri çalıştır
        run: dotnet test --project tests/ExchangeMail.Core.Tests/ExchangeMail.Core.Tests.csproj -c Release

  app:
    name: Uygulama (${{ matrix.rid }})
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Yayımla (self-contained)
        run: >
          dotnet publish src/ExchangeMail.App/ExchangeMail.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:Platform=${{ matrix.platform }}
          -o publish/${{ matrix.rid }}

      - name: Çıktıyı denetle
        shell: pwsh
        run: |
          $exe = "publish/${{ matrix.rid }}/Postaci.exe"
          if (-not (Test-Path $exe)) { throw "$exe oluşmadı" }
          if (-not (Test-Path "publish/${{ matrix.rid }}/Assets/Postaci.ico")) { throw "Simge dosyaları kopyalanmadı" }
          if (-not (Test-Path "publish/${{ matrix.rid }}/en/ExchangeMail.Core.resources.dll")) { throw "İngilizce dil kaynakları kopyalanmadı" }
          "Postaci.exe: {0:N1} MB, klasör: {1:N1} MB" -f ((Get-Item $exe).Length / 1MB),
            ((Get-ChildItem publish/${{ matrix.rid }} -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - uses: actions/upload-artifact@v7
        with:
          name: Postaci-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          retention-days: 14
          if-no-files-found: error
