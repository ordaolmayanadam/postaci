# Every push to main and every pull request: tests on Linux and Windows, then the WinUI app is
# packaged (MSIX) for x64 and ARM64. The unsigned packages are kept as artifacts for inspection;
# they install only through the Store, which signs them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Testler (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Kütüphaneleri derle
        run: |
          dotnet build src/ExchangeMail.Core/ExchangeMail.Core.csproj -c Release
          dotnet build src/ExchangeMail.ViewModels/ExchangeMail.ViewModels.csproj -c Release

      - name: Testleri çalıştır
        run: dotnet test --project tests/ExchangeMail.Core.Tests/ExchangeMail.Core.Tests.csproj -c Release

  app:
    name: Uygulama (${{ matrix.rid }})
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: MSIX paketi (imzasız)
        run: >
          dotnet build src/ExchangeMail.App/ExchangeMail.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxBundle=Never
          -p:AppxPackageDir=${{ github.workspace }}/packages/

      - name: Paketi denetle
        shell: pwsh
        run: |
          $msix = Get-ChildItem packages -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "MSIX paketi oluşmadı" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $names = $zip.Entries.FullName
            foreach ($required in "Postaci.exe", "AppxManifest.xml", "resources.pri", "en/ExchangeMail.Core.resources.dll", "Assets/Square44x44Logo.targetsize-48.png") {
              if ($names -notcontains $required) { throw "Pakette $required yok" }
            }
            $reader = New-Object IO.StreamReader ($zip.GetEntry("AppxManifest.xml").Open())
            $manifest = $reader.ReadToEnd(); $reader.Close()
            if ($manifest -notmatch 'PackageDependency Name="Microsoft\.WindowsAppRuntime') { throw "Windows App Runtime bağımlılığı manifestte yok" }
          } finally { $zip.Dispose() }
          "{0}: {1:N1} MB" -f $msix.Name, ($msix.Length / 1MB)

      - uses: actions/upload-artifact@v7
        with:
          name: Postaci-${{ matrix.rid }}-msix
          path: packages/**/*.msix
          retention-days: 14
          if-no-files-found: error
