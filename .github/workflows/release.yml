# Pushing a tag such as v1.2.0 (or v1.3.0-beta.1) builds both architectures with that version number
# and publishes a GitHub release with the zip files and their SHA-256 checksums.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/ExchangeMail.Core.Tests/ExchangeMail.Core.Tests.csproj -c Release

  publish:
    name: Paket (${{ matrix.rid }})
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Sürümü etikettan al
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Yayımla
        run: >
          dotnet publish src/ExchangeMail.App/ExchangeMail.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.value }}
          -o publish/Postaci

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item LICENSE publish/Postaci/LICENSE.txt
          Compress-Archive -Path publish/Postaci -DestinationPath "Postaci-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: Postaci-*.zip
          if-no-files-found: error

  release:
    name: GitHub sürümü
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Sağlama toplamları
        working-directory: dist
        run: sha256sum Postaci-*.zip > SHA256SUMS.txt

      - name: Sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes --title "Postacı ${TAG#v}")
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
