# Pushing a tag such as v1.2.0 builds the Microsoft Store upload packages (x64 and ARM64) with that version
# and creates the GitHub release (notes generated by GitHub). The .msixupload files are kept as a workflow artifact; they
# are submitted in Partner Center, and the Store signs and publishes them.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/ExchangeMail.Core.Tests/ExchangeMail.Core.Tests.csproj -c Release

  publish:
    name: Store paketi (${{ matrix.rid }})
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Sürümü etiketten al, manifeste yaz
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $numeric = ($version -split '-')[0]
          if ($numeric -notmatch '^\d+\.\d+\.\d+$') { throw "Etiket v1.2.3 biçiminde olmalı: ${{ github.ref_name }}" }
          $path = "src/ExchangeMail.App/Package.appxmanifest"
          [xml]$manifest = Get-Content $path -Encoding UTF8
          # The placeholders must be replaced with the Partner Center values (Product identity) first.
          if ($manifest.Package.Identity.Publisher -eq "CN=Postaci") {
            throw "Package.appxmanifest'teki Identity, Partner Center'daki ürün kimliğiyle doldurulmamış"
          }
          # MSIX versions are four numbers; the Store requires the last one to be 0.
          $manifest.Package.Identity.Version = "$numeric.0"
          $manifest.Save((Resolve-Path $path))
          "value=$numeric" >> $env:GITHUB_OUTPUT

      - name: Paketle
        run: >
          dotnet build src/ExchangeMail.App/ExchangeMail.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.value }}
          -p:GenerateAppxPackageOnBuild=true
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxBundle=Never
          -p:AppxPackageDir=${{ github.workspace }}/packages/

      - uses: actions/upload-artifact@v7
        with:
          name: store-${{ matrix.rid }}
          path: packages/**/*.msixupload
          if-no-files-found: error

  release:
    name: GitHub sürümü
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes --title "Postacı ${TAG#v}")
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}"
