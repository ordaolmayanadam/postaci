name: Hata bildirimi / Bug report
description: Postacı'da beklenmeyen bir davranış veya hata bildirin / Report unexpected behaviour or a bug
labels: [hata]
body:
  - type: markdown
    attributes:
      value: |
        Teşekkürler! Lütfen **posta içeriği, gerçek e-posta adresleri, kişi adları, sunucu adları, parola veya
        kurum içi bilgi paylaşmayın**. Hata mesajlarındaki bu tür bilgileri `***` ile maskeleyin.

        Thank you! Please **do not share mail content, real email addresses, people's names, server names,
        passwords or internal information**. Mask such details in error messages with `***`.
        You may write in English or Turkish.
  - type: textarea
    id: what
    attributes:
      label: Ne oldu? / What happened?
      description: Hatayı kısaca anlatın. / Briefly describe the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Yeniden oluşturma adımları / Steps to reproduce
      placeholder: |
        1. Takvim sayfasını açın / Open the Calendar page
        2. Hafta görünümüne geçin / Switch to week view
        3. Bir etkinliği sürükleyin / Drag an event
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış / Expected behaviour
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Hata mesajı / Error message
      description: |
        Ekranda görünen hata metni (maskelenmiş). Derleme hatasıysa çıktının ilgili kısmı.
        The error text shown on screen (masked). For build errors, the relevant part of the output.
      render: text
  - type: input
    id: version
    attributes:
      label: Postacı sürümü / Postacı version
      description: Ayarlar → Hakkında'da görünür, ya da derlediğiniz commit. / Shown under Ayarlar → Hakkında (Settings → About), or the commit you built.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows sürümü / Windows version
      options: [Windows 11, Windows 10, Diğer / Other]
    validations:
      required: true
  - type: dropdown
    id: exchange
    attributes:
      label: Exchange sürümü / Exchange version
      options: [Exchange Server SE, Exchange 2019, Exchange 2016, Bilmiyorum / Don't know]
  - type: dropdown
    id: auth
    attributes:
      label: Kimlik doğrulama / Authentication
      options: [Windows oturumu / Windows session, Kullanıcı adı ve parola / User name and password]
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik / Privacy
      options:
        - label: Bu bildirimde kişisel veya kurum içi bilgi bulunmadığını kontrol ettim. / I checked that this report contains no personal or internal information.
          required: true
