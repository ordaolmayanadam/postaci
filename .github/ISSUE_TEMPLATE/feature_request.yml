name: Özellik isteği
description: Yeni bir özellik veya iyileştirme önerin
labels: [öneri]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi ihtiyacı karşılıyor?
      description: Bugün neyi yapamıyorsunuz ya da ne zor geliyor?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Önerilen çözüm
      description: Nasıl çalışmasını beklersiniz? Outlook/OWA'daki karşılığı varsa belirtin.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Düşünülen alternatifler
  - type: dropdown
    id: area
    attributes:
      label: Alan
      options: [Posta, Takvim, Kişiler, Ayarlar, Bildirimler / tepsi, Kurulum / dağıtım, Diğer]
